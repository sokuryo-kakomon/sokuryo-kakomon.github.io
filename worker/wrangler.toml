name = "sokuryo-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 回数の数え（日付ごと）。初回は `npx wrangler kv namespace create LIMITS` で作り、出た id をここへ
[[kv_namespaces]]
binding = "LIMITS"
id = "a9f19529d06b4aaf9654f1b4e2442363"

[vars]
SITE_URL = "https://sokuryo-kakomon.com"
ALLOWED_ORIGINS = "https://sokuryo-kakomon.com,http://127.0.0.1:4321,http://127.0.0.1:4322,http://localhost:4321"
AI_MODEL = "claude-opus-5-5"
AI_MODEL_FREE = "claude-sonnet-5-5"
AI_EFFORT = "medium"
FREE_PER_IP = "2"
FREE_TOTAL = "60"
PAID_PER_DAY = "15"
PAID_PER_MONTH = "90"
# 秘密の値は `npx wrangler secret put 名前` で入れる（ここには書かない）:
#   ANTHROPIC_API_KEY / STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / TURNSTILE_SECRET
STRIPE_PRICE_ID = "price_1UXsA0AStZo8t4laPGrmcfeW"
